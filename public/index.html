<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>java-path</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./course-outline.js" defer></script>
    <script src="./lesson-content-level1.js" defer></script>
    <script src="./lesson-content-level2.js" defer></script>
    <script src="./lesson-content-level3.js" defer></script>
    <script src="./lesson-content-level4.js" defer></script>
    <script src="./lesson-content-level5.js" defer></script>
    <script src="./lesson-content-level6.js" defer></script>
    <script src="./lesson-content-level7.js" defer></script>
    <script src="./lesson-content-level8.js" defer></script>
    <script src="./lesson-content-level9.js" defer></script>
    <script src="./lesson-content-level10.js" defer></script>
    <script src="./lesson-content-level11.js" defer></script>
    <script src="./lesson-content-level12.js" defer></script>
    <script src="./lesson-content-level13.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="training-app">
      <header class="app-header">
        <div class="brand">
          <span class="brand-badge" aria-hidden="true">
            <span class="brand-letter">J</span>
          </span>
          <div>
            <strong>java-path</strong>
            <span>Java 学习路径与代码实验室</span>
          </div>
        </div>

        <div class="progress-hub" aria-label="完整修炼进度">
          <strong>完整修炼进度: <span id="progressText">0/0 关</span></strong>
          <div class="progress-track"><span id="progressBar"></span></div>
          <b id="progressPercent">0%</b>
        </div>

        <div class="header-actions">
          <button class="square-button" id="themeToggle" type="button" aria-label="切换日夜模式" title="切换日夜模式">
            <span class="button-glyph">☾</span>
          </button>
          <button class="square-button" id="resetProgress" type="button" aria-label="重置学习进度" title="重置学习进度">
            <span class="button-glyph">↻</span>
          </button>
        </div>
      </header>

      <div class="study-grid">
        <aside class="level-sidebar" aria-label="课程关卡">
          <div id="levelList" class="level-list"></div>
        </aside>

        <main class="lesson-column" aria-label="课程正文">
          <article id="lessonArticle" class="lesson-article"></article>
        </main>

        <section class="practice-column" aria-label="Java 编辑器与输出">
          <div class="editor-panel">
            <div class="panel-toolbar">
              <span><b class="tool-mark">{ }</b> Java 编辑器 <em>Main.java</em></span>
              <div>
                <button class="soft-button" id="focusCode" type="button">
                  <span class="button-glyph">↗</span>
                  专注代码
                </button>
                <button class="soft-button" id="showAnswer" type="button">
                  <span class="button-glyph">?</span>
                  查看答案
                </button>
                <button class="run-button" id="runCode" type="button">
                  <span class="button-glyph">▶</span>
                  运行代码
                </button>
              </div>
            </div>
            <div class="code-surface">
              <pre class="editor-lines" id="editorLines" aria-hidden="true">1</pre>
              <textarea id="codeEditor" spellcheck="false" wrap="soft"></textarea>
            </div>
          </div>

          <div class="io-grid">
            <div class="input-panel">
              <div class="panel-toolbar">
                <span><b class="tool-mark">&lt;</b> 标准输入 <em>stdin</em></span>
                <button class="link-button" id="clearStdin" type="button">清空输入</button>
              </div>
              <textarea id="stdinInput" spellcheck="false" wrap="soft" aria-label="标准输入"></textarea>
            </div>

            <div class="console-panel">
              <div class="panel-toolbar">
                <span><b class="tool-mark">$_</b> 控制台输出 <em>Terminal</em></span>
                <button class="link-button" id="clearConsole" type="button">清空控制台</button>
              </div>
              <pre id="consoleOutput">Loaded: 1. 你好 Java (Hello World)</pre>
              <span id="runMeta" class="run-meta">等待运行</span>
            </div>
          </div>

          <div class="submit-row">
            <button class="submit-button" id="submitTask" type="button">
              <span class="button-glyph">✓</span>
              提交验证
            </button>
            <button class="next-button" id="nextLesson" type="button" hidden disabled>
              <span class="button-glyph">→</span>
              下一关
            </button>
          </div>
        </section>
      </div>
    </div>

    <aside class="answer-drawer" id="answerDrawer" aria-hidden="true">
      <div class="answer-drawer-header">
        <div>
          <strong>参考答案</strong>
          <span>当前关卡示例</span>
        </div>
        <button class="square-button compact" id="closeAnswer" type="button" aria-label="隐藏答案" title="隐藏答案">
          <span class="button-glyph">×</span>
        </button>
      </div>
      <div class="answer-drawer-body">
        <div id="answerContent"></div>
      </div>
    </aside>

    <div class="focus-modal" id="focusModal" aria-hidden="true">
      <div class="focus-dialog" role="dialog" aria-modal="true" aria-label="专注代码">
        <header class="focus-header">
          <div>
            <strong>专注代码</strong>
            <span>Main.java · 单文件练习</span>
          </div>
          <div class="focus-actions">
            <button class="soft-button" id="focusRun" type="button">
              <span class="button-glyph">▶</span>
              运行
            </button>
            <button class="square-button compact" id="closeFocus" type="button" aria-label="关闭专注模式" title="关闭">
              <span class="button-glyph">×</span>
            </button>
          </div>
        </header>
        <div class="focus-body">
          <div class="code-surface focus-code-surface">
            <pre class="editor-lines" id="focusLines" aria-hidden="true">1</pre>
            <textarea id="focusEditor" spellcheck="false" wrap="soft"></textarea>
          </div>
          <div class="focus-io-column">
            <div class="focus-input-panel">
              <div class="focus-console-title">
                <span>输入</span>
                <span>stdin</span>
              </div>
              <textarea id="focusStdinInput" spellcheck="false" wrap="soft" aria-label="专注模式标准输入"></textarea>
            </div>
            <div class="focus-console">
              <div class="focus-console-title">
                <span>输出</span>
                <span id="focusRunMeta">等待运行</span>
              </div>
              <pre id="focusOutput"></pre>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
